<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Shubham Mishra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--dark:#1f2328;--ink-d:#ece9e3;--ink-d2:#a9aeb6;--accent:#a3480f;--accent-2:#e07434;--line-d:#3a4048}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--dark);color:var(--ink-d);text-align:center;padding:40px 22px;
  font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:4px}
.code{font:700 clamp(64px,16vw,120px)/1 'Space Grotesk',sans-serif;color:var(--accent-2);letter-spacing:-.04em;margin:0 0 8px}
h1{font:600 clamp(22px,4vw,30px)/1.2 'Space Grotesk',sans-serif;color:#fff;letter-spacing:-.02em;margin:0 0 14px}
p{color:var(--ink-d2);max-width:44ch;margin:0 auto 30px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{
  display:inline-flex;align-items:center;text-decoration:none;
  font:600 14px/1 'Inter',sans-serif;padding:14px 24px;border-radius:4px;transition:.2s;
}
.primary{background:var(--accent);color:#fff}
.primary:hover{background:var(--accent-2)}
.ghost{background:transparent;color:var(--ink-d);border:1px solid var(--line-d)}
.ghost:hover{border-color:var(--accent-2);color:var(--accent-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist.</h1>
    <p>Which is a shame, because the ones that do are quite good. Try one of those instead.</p>
    <div class="row">
      <a class="btn primary" href="/">Back to the homepage</a>
      <a class="btn ghost" href="mailto:shubham.m7336@gmail.com">Email me</a>
    </div>
  </main>
</body>
</html>
